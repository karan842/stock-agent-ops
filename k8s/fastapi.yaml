# =============================================================================
# FastAPI Backend Deployment
# =============================================================================
# NOTE: Replace 585662413932 with your actual AWS account ID
# Or use: sed -i 's/585662413932/123456789012/g' k8s/*.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        # Replace with your ECR URL after terraform apply
        image: 585662413932.dkr.ecr.us-east-1.amazonaws.com/mlops-fastapi:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: QDRANT_HOST
          value: "qdrant"
        - name: QDRANT_PORT
          value: "6333"
        envFrom:
        - secretRef:
            name: mlops-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 20
        volumeMounts:
        - name: outputs-volume
          mountPath: /app/outputs
      volumes:
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: mlops-outputs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: mlops
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: fastapi
