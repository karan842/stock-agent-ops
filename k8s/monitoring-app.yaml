# =============================================================================
# Monitoring Dashboard (Streamlit) Deployment
# =============================================================================
# NOTE: Replace <AWS_ACCOUNT_ID> with your actual AWS account ID

apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-app
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-app
  template:
    metadata:
      labels:
        app: monitoring-app
    spec:
      containers:
      - name: monitoring-app
        # Replace with your ECR URL after terraform apply
        image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/mlops-monitoring:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8502
        env:
        - name: API_URL
          value: "http://fastapi:8000"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
        volumeMounts:
        - name: outputs-volume
          mountPath: /app/outputs
      volumes:
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: mlops-outputs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-app
  namespace: mlops
spec:
  type: LoadBalancer
  ports:
  - port: 8502
    targetPort: 8502
  selector:
    app: monitoring-app
