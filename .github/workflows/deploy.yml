name: Deploy to Production

on:
  push:
    branches: [ "main", "aws-deployment" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_FASTAPI: mlops-fastapi
  ECR_REPOSITORY_FRONTEND: mlops-frontend
  ECR_REPOSITORY_MONITORING: mlops-monitoring
  EKS_CLUSTER_NAME: mlops-stock-cluster

jobs:
  infrastructure:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
        terraform_wrapper: false

    - name: Terraform Init
      run: terraform init

    - name: Terraform Apply
      run: terraform apply -auto-approve -var="aws_region=${{ env.AWS_REGION }}"

    - name: Get ECR Registry
      id: ecr-registry
      run: |
        # Try to get from terraform, otherwise construct it
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
        echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

    outputs:
      ecr_registry: ${{ steps.ecr-registry.outputs.registry }}

  deploy_apps:
    name: Build and Deploy Apps
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # Define registry from `needs` or derive it again (deriving is safer if separate jobs)
    # Using the output from infrastructure job
    
    - name: Build and Push FastAPI
      env:
        ECR_REGISTRY: ${{ needs.infrastructure.outputs.ecr_registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FASTAPI:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_FASTAPI:latest ./backend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_FASTAPI:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_FASTAPI:latest

    - name: Build and Push Frontend
      env:
        ECR_REGISTRY: ${{ needs.infrastructure.outputs.ecr_registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest ./frontend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

    - name: Build and Push Monitoring
      env:
        ECR_REGISTRY: ${{ needs.infrastructure.outputs.ecr_registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_MONITORING:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_MONITORING:latest ./monitoring_app
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_MONITORING:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_MONITORING:latest

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

    - name: Create secrets.yaml
      run: |
        cat <<EOF > k8s/secrets.yaml
        apiVersion: v1
        kind: Secret
        metadata:
          name: mlops-secrets
          namespace: mlops
        type: Opaque
        data:
          AWS_ACCESS_KEY_ID: $(echo -n "${{ secrets.AWS_ACCESS_KEY_ID }}" | base64)
          AWS_SECRET_ACCESS_KEY: $(echo -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | base64)
          AWS_REGION: $(echo -n "${{ env.AWS_REGION }}" | base64)
          DAGSHUB_USERNAME: $(echo -n "${{ secrets.DAGSHUB_USERNAME }}" | base64)
          DAGSHUB_TOKEN: $(echo -n "${{ secrets.DAGSHUB_TOKEN }}" | base64)
          MLFLOW_TRACKING_USERNAME: $(echo -n "${{ secrets.DAGSHUB_USERNAME }}" | base64)
          MLFLOW_TRACKING_PASSWORD: $(echo -n "${{ secrets.DAGSHUB_TOKEN }}" | base64)
          FINNHUB_API_KEY: $(echo -n "${{ secrets.FINNHUB_API_KEY }}" | base64)
        EOF

    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ needs.infrastructure.outputs.ecr_registry }}
      run: |
        # Update manifest images
        sed -i "s|<AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com|$ECR_REGISTRY|g" k8s/*.yaml

        # Deploy
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/volumes.yaml
        kubectl apply -f k8s/redis.yaml
        kubectl apply -f k8s/qdrant.yaml
        kubectl apply -f k8s/prometheus.yaml
        kubectl apply -f k8s/grafana.yaml
        kubectl apply -f k8s/fastapi.yaml
        kubectl apply -f k8s/frontend.yaml
        kubectl apply -f k8s/monitoring-app.yaml

        # Restart deployments to pick up new images
        kubectl rollout restart deployment/fastapi -n mlops
        kubectl rollout restart deployment/frontend -n mlops
        kubectl rollout restart deployment/monitoring-app -n mlops
